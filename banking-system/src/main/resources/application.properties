# ==================== APP ====================
spring.application.name=banking-system

# ==================== DATABASE (MySQL, UTF-8) ====================
# IMPORTANT : forcer l'UTF-8 côté JDBC + timezone + SSL off en local
spring.datasource.url=jdbc:mysql://localhost:3306/banking_system?useUnicode=true&characterEncoding=utf8&connectionCollation=utf8mb4_unicode_ci&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.chat.options.model=llama3.2

# (Optionnel mais utile) ? au cas où, on force l'UTF-8 dès l'ouverture de connexion
spring.datasource.hikari.connectionInitSql=SET NAMES utf8mb4 COLLATE utf8mb4_unicode_ci
# On pousse aussi des propriétés UTF-8 au driver
spring.datasource.hikari.data-source-properties.useUnicode=true
spring.datasource.hikari.data-source-properties.characterEncoding=utf8

# ==================== JPA / HIBERNATE ====================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=true

# ==================== SERVER / ENCODAGE ====================
server.port=8084

# Tomcat: forcer l'encodage UTF-8 des requêtes/réponses
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true


# ==================== JWT SECURITY ====================
# Clé de 64 octets (Base64) générée de manière sécurisée
app.jwtSecret=huWcf0XnThn4nFw44fIT1nSx0W2G35Z0QHbYzckMShl7l6E9bNUdgmjE8YjC4n6hv3DxxmIV6o9bHtEwD2jRhg==
app.jwtExpirationInMs=86400000
# 86400000 ms = 24 heures (1 jour)

# ==================== LOGGING ====================
# ==================== LOGGING ====================
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE
logging.level.com.banking=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.com.banking.security.jwt=DEBUG
logging.level.org.springframework.web=DEBUG

# Limite dure d'admins (facultatif; 2 par défaut)
app.security.admin.max=2


# ==================== ACTUATOR & MAPPINGS ====================
management.endpoints.web.base-path=/actuator
management.endpoints.web.exposure.include=health,info,mappings,loggers,logfile
management.endpoint.mappings.enabled=true
management.endpoint.health.show-details=always
management.endpoint.logfile.enabled=true
spring.profiles.active=dev


# ==================== SCHEDULER (Frais automatiques) ====================
spring.task.scheduling.enabled=true
# --- Fichier de log (chemin ABSOLU Windows conseillé) ---
# Exemple: un fichier dans ton projet
logging.file.name=C:/Users/User/Downloads/Banking-app/banking-system/logs/banking.log
# OU (plus court) : logging.file.name=banking.log  (créé dans le répertoire de lancement)

# ==================== ERREURS (pour déboguer les 500) ====================

# Show full error info in responses (DEV ONLY!)
server.error.include-message=ALWAYS
server.error.include-binding-errors=ALWAYS
server.error.include-exception=true
server.error.include-stacktrace=ALWAYS


